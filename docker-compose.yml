version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medicare-agent-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      # Mount data directories for persistence
      - ./data:/app/data
      - ./docs:/app/docs
    networks:
      - medicare-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medicare-agent-frontend
    environment:
      # Frontend runs in browser, so it needs to access backend via localhost
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "4000:3000"  # External port 4000 -> Internal port 3000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - medicare-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

networks:
  medicare-network:
    driver: bridge

volumes:
  # Named volumes for persistence (optional)
  data:
  docs:
