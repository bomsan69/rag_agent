services:
  # NOTE: Redis is no longer needed - using LangGraph SQLite checkpoint instead
  # Uncomment below if you want to use Redis-based checkpoint (requires additional setup)
  # redis:
  #   image: redis:7-alpine
  #   container_name: medicare-agent-redis
  #   command: redis-server --appendonly yes
  #   volumes:
  #     - redis-data:/data
  #   networks:
  #     - medicare-network
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 10s
  #   restart: unless-stopped

  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medicare-agent-backend
    env_file:
      - .env
    # Docker 내부 네트워크에서만 접근 가능 (외부 인터넷 차단)
    expose:
      - "8000"
    volumes:
      # Mount data directories for persistence
      # LangGraph checkpoint SQLite database will be stored in ./data/checkpoints/
      - ./data:/app/data
      - ./docs:/app/docs
      # Mount logs directory for daily log files (YYYY-MM-DD_app.log format)
      - ./logs:/app/logs
    networks:
      - medicare-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medicare-agent-frontend
    environment:
      # Docker 내부 네트워크에서 서비스명으로 통신 (Next.js와만 통신)
      - BACKEND_API_URL=http://backend:8000/api/v1
    ports:
      - "4000:3000"  # External port 4000 -> Internal port 3000 (Cloudflare Zero Trust 연결용)
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - medicare-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

networks:
  medicare-network:
    driver: bridge

volumes:
  # Named volumes for persistence
  data:
    # Contains LangGraph checkpoint SQLite database (./data/checkpoints/)
    # and vector indexes (./data/indexes/)
  docs:
  # redis-data:  # No longer needed - using LangGraph SQLite checkpoint
  #   driver: local
