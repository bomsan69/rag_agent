services:
  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medicare-agent-backend
    env_file:
      - .env
    # Docker 내부 네트워크에서만 접근 가능 (외부 인터넷 차단)
    expose:
      - "8000"
    volumes:
      # Mount data directories for persistence
      - ./data:/app/data
      - ./docs:/app/docs
    networks:
      - medicare-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medicare-agent-frontend
    environment:
      # Docker 내부 네트워크에서 서비스명으로 통신 (Next.js와만 통신)
      - BACKEND_API_URL=http://backend:8000/api/v1
    ports:
      - "4000:3000"  # External port 4000 -> Internal port 3000 (Cloudflare Zero Trust 연결용)
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - medicare-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

networks:
  medicare-network:
    driver: bridge

volumes:
  # Named volumes for persistence (optional)
  data:
  docs:
