[project]
name = "medicare-agent"
version = "0.1.0"
description = "Medicare AI Chatbot with RAG - Citation-first, regulation-safe AI assistant"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=0.2.0",
    "pymupdf>=1.24.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "numpy>=2.0.0",
    "rank-bm25>=0.2.2",
    "faiss-cpu>=1.9.0",
    "sse-starlette>=2.2.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
